spring:
  application:
    name: Nothing API Router

  datasource:
    url: jdbc:mysql://localhost:3306/nothing_router
    username: root
    password: 123456
    drever-class-name: com.mysql.cj.jdbc.Driver

#Deepseek上游调用配置
router:
  deepseek:
    base-url: https://api.deepseek.com
    #从运行环境中读取密钥
    api-key: ${DEEPSEEK_API_KEY}
    #实际上调用的上游模型
    model: deepseek-flash